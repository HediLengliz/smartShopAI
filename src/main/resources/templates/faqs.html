<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>FAQs</title>
</head>
<body>
<h1>FAQs</h1>
<dl>
    <div th:each="f : ${faqs}">
        <dt th:text="${f.question}"></dt>
        <dd th:text="${f.answer}"></dd>
    </div>
</dl>
</body>
</html>
